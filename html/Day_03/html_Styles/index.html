<body style="background-color: rgba(115, 19, 19, 0.202);">
    <h1 style="background-color: rgb(179, 25, 25);">Welcome to Styles</h1>
    <h1>What is style?</h1>
    <p style="background-color: tomato;">style attribute is added to style an element like font or size</p>
    <h2 style="color: rgb(10, 95, 30);">Is this text color style element?</h2>
    <p style="color: rgb(10, 10, 116);">Yes it is a text style element</p>

    <h2 style="font-size: 100px;">bigger font size</h2>
    <p style="font-size: 70px;">Another font size</p>
    <h2 style="text-align: end;">text align style at the EnD</h2>
    <p style="text-align: center;">text align to the center</p>
